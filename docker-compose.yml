services:
  mongodb:
    image: mongo:latest
    container_name: mongodb
    ports:
      - "27019:27017"
    volumes:
      - mongo-data:/data/db

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "8080:8080"
    environment:
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - PRODUCT_SERVICE_URL=http://product-service:8082
      - USER_SERVICE_URL=http://user-service:8081
      - CART_SERVICE_URL=http://cart-service:8083
      - ORDER_SERVICE_URL=http://order-service:8084
    depends_on:
      - product-service
      - user-service
      - cart-service
      - order-service

  product-service:
    build: ./product-service
    container_name: product-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_MONGODB_URI=mongodb://mongodb:27017/product_db
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/product_db
    depends_on:
      - mongodb

  user-service:
    build: ./user-service
    container_name: user-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_MONGODB_URI=mongodb://mongodb:27017/user_db
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/user_db
    depends_on:
      - mongodb

  cart-service:
    build: ./cart-service
    container_name: cart-service
    ports:
      - "8083:8083"
    environment:
      - SPRING_MONGODB_URI=mongodb://mongodb:27017/cart_db
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/cart_db
    depends_on:
      - mongodb

  order-service:
    build: ./order-service
    container_name: order-service
    ports:
      - "8084:8084"
    environment:
      - SPRING_MONGODB_URI=mongodb://mongodb:27017/order_db
      - SPRING_DATA_MONGODB_URI=mongodb://mongodb:27017/order_db
    depends_on:
      - mongodb

  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "80:80"
    depends_on:
      - api-gateway

volumes:
  mongo-data:
