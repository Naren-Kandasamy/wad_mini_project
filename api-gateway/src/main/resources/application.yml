server:
  port: 8080

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
    org.springframework.security: INFO

spring:
  application:
    name: api-gateway
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:change-me}
            client-secret: ${GOOGLE_CLIENT_SECRET:change-me}
            scope: email, profile
  cloud:
    gateway:
      routes:
        - id: product-service
          uri: http://product-service:8082
          predicates:
            - Path=/api/products, /api/products/**
        - id: user-service
          uri: http://user-service:8081
          predicates:
            - Path=/api/users, /api/users/**
        - id: cart-service
          uri: http://cart-service:8083
          predicates:
            - Path=/api/cart, /api/cart/**
        - id: order-service
          uri: http://order-service:8084
          predicates:
            - Path=/api/orders, /api/orders/**
      globalcors:
        corsConfigurations:
          '[/**]':
            allowedOrigins: "http://localhost:80"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true
